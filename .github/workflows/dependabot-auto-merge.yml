name: dependabot-auto-merge

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  auto-merge:
    # Patch and minor updates merge on their own once the required checks
    # pass. Majors, and anything CI rejects, stay open for a maintainer.
    # `forge init` removes this workflow: it needs the repository's
    # "Allow auto-merge" setting and required status checks, which a new
    # project has not chosen yet.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
