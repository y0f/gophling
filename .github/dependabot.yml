version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it: most compromised
    # or broken releases are withdrawn within days. Security updates are
    # not delayed.
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns: ["*"]
  # Developer tooling (linter, generators, scanner, live reload) lives in its
  # own module so it never enters the application's dependency graph, but it
  # still needs bumping like everything else.
  - package-ecosystem: gomod
    directory: "/tools"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      go-tools:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/deployments"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
  # The docker ecosystem only reads Dockerfiles, so the images in
  # docker-compose.yml went unmaintained. They need their own ecosystem.
  - package-ecosystem: docker-compose
    directory: "/deployments"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        patterns: ["*"]
        # Majors stay out of the group so each one arrives as its own PR. A
        # bundled postgres major silently breaks `task up` for everyone holding
        # an existing pgdata volume, and is easy to miss between grafana and
        # tempo patch bumps.
        update-types: ["minor", "patch"]
